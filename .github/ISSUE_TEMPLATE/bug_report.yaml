name: Bug Report
description: Report a bug
title: 'bug: '
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Prerequisites
      options:
        - label:
            I have searched [existing
            issues](https://github.com/barrettruth/preview.nvim/issues)
          required: true
        - label: I have updated to the latest version
          required: true

  - type: textarea
    attributes:
      label: 'Neovim version'
      description: 'Output of `nvim --version`'
      render: text
    validations:
      required: true

  - type: input
    attributes:
      label: 'Operating system'
      placeholder: 'e.g. Arch Linux, macOS 15, Ubuntu 24.04'
    validations:
      required: true

  - type: input
    attributes:
      label: Provider or filetype
      placeholder: 'e.g. typst, tex, markdown, github, quarto, custom provider'
    validations:
      required: true

  - type: textarea
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 'Health check'
      description: 'Output of `:checkhealth preview`'
      render: text

  - type: textarea
    attributes:
      label: 'Compiler output'
      description: 'Relevant output from `:Preview output` or `require(''preview'').result()`'
      render: text

  - type: textarea
    attributes:
      label: Preview config
      description: 'Relevant `vim.g.preview` or `require(''preview'').setup(...)` config'
      render: lua

  - type: textarea
    attributes:
      label: Minimal reproduction
      description: |
        Save the script below as `repro.lua`, edit it to match your provider and compiler setup, and run:
        ```
        nvim -u repro.lua
        ```
        Confirm the bug reproduces with this config before submitting.
      render: lua
      value: |
        vim.env.LAZY_STDPATH = '.repro'
        load(vim.fn.system('curl -s https://raw.githubusercontent.com/folke/lazy.nvim/main/bootstrap.lua'))()
        require('lazy.nvim').setup({
          spec = {
            {
              'barrettruth/preview.nvim',
              init = function()
                vim.g.preview = {
                  typst = true,
                }
              end,
            },
          },
        })
    validations:
      required: true
